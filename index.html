<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(sessionStorage.getItem("qxgr_rewind_request"))document.documentElement.classList.add("rewind-loading");}catch(e){}</script>
  <meta name="game-version" content="audio-mix-8">
  <title>阙下归人 · 渠县汉阙互动解谜</title>
  <link rel="stylesheet" href="css/style.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/scene-art.css">
  <link rel="stylesheet" href="css/bus.css">
  <link rel="stylesheet" href="css/tomb.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/encounter.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/fire.css">
  <link rel="stylesheet" href="css/chapters.css">
  <link rel="stylesheet" href="css/finish-art.css">
  <link rel="stylesheet" href="css/first-memory.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/immersive.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/actors.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/refinements.css?v=audio-mix-8">
  <link rel="stylesheet" href="css/story-play.css?v=audio-mix-8">
</head>
<body>
  <div id="game">

    <!-- ======== 舞台 ======== -->
    <div id="stage">
      <div id="bg-layer"></div>
      <div id="char-layer"></div>
      <div id="street-air" aria-hidden="true"></div>
      <div id="light-layer"><div id="flame"></div></div>
      <div id="fx-layer"></div>
      <div id="minigame-layer"></div>
      <div id="vignette"></div>
    </div>

    <!-- ======== HUD ======== -->
    <div id="hint"></div>
    <div id="hp-bar" class="hidden">
      <span class="hp-label">心神</span>
      <div id="hp-segs"></div>
    </div>
    <button id="mute-btn" title="声音开关">🔊</button>

    <div id="hud-fire"></div>
    <button id="hud-book" title="证据册">
      <span class="book-icon">📖</span><span>证据册</span>
      <span id="book-badge"></span>
    </button>

    <!-- ======== 对话框 ======== -->
    <div id="dlg">
      <div id="dlg-name">旁白</div>
      <div id="dlg-text"></div>
      <button id="dlg-fast" title="快进">⏩ 快进</button>
      <div id="dlg-key">✦ 关键证据</div>
      <div id="dlg-continue">▼ 点击继续</div>
    </div>

    <!-- ======== 弹层 ======== -->
    <div id="overlay">
      <canvas id="ov-canvas"></canvas>
      <div id="ov-text"></div>
    </div>

    <div id="intertitle">
      <div id="it-title">序幕</div>
      <div id="it-sub">昏沉梦</div>
    </div>

    <div id="artifact-card">
      <div id="art-tag">文物原型</div>
      <div id="art-name">胡汉交兵画像石</div>
      <div id="art-asset"></div>
    </div>

    <div id="interact-card">
      <div id="card-title">交互</div>
      <div id="card-asset"></div>
      <div id="card-desc"></div>
      <button id="card-btn">确认</button>
    </div>

    <div id="fx-panel">
      <div id="panel-text"></div>
      <div id="panel-asset"></div>
    </div>

    <div id="toasts"></div>
    <div id="warn-flash"></div>

    <div id="death" role="alert" aria-live="assertive">
      <div id="death-msg">心神耗尽……</div>
      <div class="death-sub">意识沉入黑暗，正在回到本段……</div>
    </div>

    <!-- ======== 证据册 ======== -->
    <div id="evidence-book">
      <div class="book-panel">
        <div class="book-head">
          <span class="book-title">身份证据册</span>
          <span id="book-count"></span>
          <button id="book-close">✕</button>
        </div>
        <div id="book-tabs"></div>
        <div id="book-content"></div>
        <div class="book-foot">六页：籍贯 · 官职 · 品格 · 亲缘 · 经历 · 结局</div>
      </div>
    </div>

    <!-- ======== 剧情回顾（探案模式） ======== -->
    <div id="review-modal">
      <div class="review-panel">
        <div class="review-head">剧情回顾</div>
        <div id="review-hint"></div>
        <div id="review-list"></div>
        <div class="review-foot">
          <span id="review-progress"></span>
          <button id="review-done">继续前行 →</button>
        </div>
      </div>
    </div>

    <!-- ======== 文档阅读（名帖等） ======== -->
    <div id="document-modal">
      <div class="doc-panel">
        <div class="doc-head">
          <span id="doc-title"></span>
          <button id="doc-close">✕</button>
        </div>
        <div id="doc-body"></div>
      </div>
    </div>

    <!-- ======== 标题界面 ======== -->
    <div id="title-screen" class="show">
      <div id="title-bg"></div>
      <div class="title-main">
        <h1>阙下归人</h1>
        <p class="subtitle">渠县汉阙 · 二维剧情解谜 · 中式志怪</p>
        <p class="slice">剧情共8幕，融入真实渠县场景，祝您游玩愉快。</p>

        <div class="player-setup">
          <label>你的名字 <input id="player-name" type="text" maxlength="8" placeholder="请输入名字" autocomplete="given-name" required></label>
          <span class="gender-label">称呼</span>
          <button class="gender-btn active" data-g="f">女 · 小姑娘</button>
          <button class="gender-btn" data-g="m">男 · 小伙子</button>
        </div>

        <button id="btn-start" disabled>选择游玩模式</button>
        <p class="tips">填写名字后选择模式 · 游戏中可返回上一句、上一步，或重玩当前交互</p>
      </div>
    </div>

    <dialog id="mode-select" aria-labelledby="mode-select-title">
      <h2 id="mode-select-title">选择游玩方式</h2>
      <p>两种模式共用剧情与结局。</p>
      <div class="modes">
        <button class="mode-card" data-mode="tour"><span class="mode-name">游览模式</span><span class="mode-desc">关键证据自动收录，听声选错可重试，无心神压力。</span></button>
        <button class="mode-card" data-mode="detective"><span class="mode-name">探案模式</span><span class="mode-desc">线索不高亮，在剧情回顾中自行辨认证据；误判扣心神，铭文词块更细。</span></button>
      </div>
      <button id="mode-cancel">返回填写名字</button>
    </dialog>

    <!-- ======== 结算界面（渠县汉阙导览地图） ======== -->
    <div id="ending">
      <div class="ending-panel">
        <h2>渠县汉阙 · 导览地图</h2>
        <p class="ending-sub">冯焕阙的故事讲完了。完成导览，点亮渠县汉阙地图——还有许多沉默的往事，等待与你相逢。</p>
        <div id="ending-map"></div>
        <div class="ending-btns">
          <button id="ending-book">查看证据册</button>
          <button id="ending-restart">重新开始</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/config.js?v=audio-mix-8"></script>
  <script src="js/data.js"></script>
  <script src="js/audio-map.js?v=audio-mix-8"></script>
  <script src="js/audio.js?v=audio-mix-8"></script>
  <script src="js/music.js?v=audio-mix-8"></script>
  <script src="js/engine.js?v=audio-mix-8"></script>
  <script src="js/minigames.js?v=audio-mix-8"></script>
  <script src="js/street.js?v=audio-mix-8"></script>
  <script src="js/bus.js?v=audio-mix-8"></script>
  <script src="js/tomb.js?v=audio-mix-8"></script>
  <script src="js/encounter.js?v=audio-mix-8"></script>
  <script src="js/fire.js"></script>
  <script src="js/chapters.js?v=audio-mix-8"></script>
  <script src="js/progress.js?v=audio-mix-8"></script>
  <script src="js/first-memory.js?v=audio-mix-8"></script>
  <script src="js/immersive.js?v=audio-mix-8"></script>
  <script src="js/actors.js?v=audio-mix-8"></script>
  <script src="js/refinements.js?v=audio-mix-8"></script>
  <script src="js/story-play.js?v=audio-mix-8"></script>
  <script src="js/main.js?v=audio-mix-8"></script>
</body>
</html>
